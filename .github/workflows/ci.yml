name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # The upstream Arduino compile jobs (arduino-cli, four boards) were removed in this fork: the language enum, the board layer and the build system changed (ESP-IDF
  # port in idf/), so TamaPoke.ino is only kept untouched as the merge base and no longer builds with arduino-cli. The jobs below replace them.
  fakepod-host:
    name: Fake Pod app on the PC (compile + run every screen)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install pillow
      - name: Width budget of the Chinese strings
        run: python3 tools/check_zh_width.py
      # tools/host/build.sh compiles the real app (idf/main/tamapoke_app.cpp) against the compat layer and fake hardware; shots.sh renders every screen in every language.
      - name: Compile and render every screen
        run: tools/host/shots.sh
      - name: Screens were produced
        run: test "$(ls tools/host/out/shots/*.png | wc -l)" -ge 40

  generated:
    name: Generated headers up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install pillow

      - name: Regenerate dex.h and species.h
        run: |
          python3 tools/gen_dex.py
          python3 tools/sprites.py emit

      # dex.h y species.h llevan "GENERADO - no editar" en su cabecera; esto pilla
      # a quien edite la salida en vez del generador, o se olvide de regenerar
      # tras tocar los datos de origen.
      - name: Fail if regenerating produced a diff
        run: git diff --exit-code -- dex.h species.h

  tools-lint:
    name: Lint tools/ (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install ruff
      - run: ruff check tools/

  tests:
    name: Game-logic tests (host, no board)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # pet.cpp / i18n.cpp / dex.h compilan y corren en el PC contra unos shims
      # de Arduino, con millis() y random() falsos y una NVS en memoria. Aqui es
      # donde se han roto las cosas: los tres bugs de la v1.3, v1.4 y v1.8 eran
      # logica pura y estos tests los pillan sin tocar la placa.
      - name: Run the suite (plus AddressSanitizer + UBSan)
        run: ./test/run_tests.sh --asan

  i18n:
    name: i18n format-specifier consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python3 tools/test_i18n_formats.py
